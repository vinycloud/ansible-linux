---
- name: Preparing Workstation
  hosts: localhost
  connection: local
  tasks:

    - name: First update cache....
      become: true
      ansible.builtin.apt:
        update_cache: yes

    - name: Installing Linux Apps
      become: true
      apt:
        name: '{{ item }}'
        install_recommends: yes
        state: present
      loop:
          - vim
          - htop
          - curl
          - fuse
          - wget
          - ncdu
          - tree
          - apt-transport-https
          - ca-certificates
          - gnupg
          - python3-pip
          - make
          - git
          - bash-completion
          - gnupg-agent
          - zsh          
          - fonts-hack
          - tilix          
          - krita
          - jq
          - mtr
          - guvcview                    
          - vlc
          - gnome-tweaks
          - calibre
          - wireshark          
          - terminator 
          - snapd         
          - gnome-shell-extensions
          - libarchive-tools
          - nmap

    - block:
      - name: Download EKS-Node-Viewer binary...
        become: true
        get_url:
          url: "https://github.com/awslabs/eks-node-viewer/releases/download/v0.7.4/eks-node-viewer_Linux_x86_64"
          dest: "/usr/local/bin/eks-node-viewer"
          mode: 755                     

      - name: Install Spotify...
        become: true        
        community.general.snap:
          name: 'spotify'
          classic: yes

      - name: Verify if Oh-My-zsh is installed
        command: test -d /home/{{ ansible_user_id }}/.oh-my-zsh
        register: ohmyzsh
        ignore_errors: true

      - name: Installing Oh-My-zsh
        shell:
          cmd: 'curl -fsL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | bash'
          warn: false
        when: ohmyzsh.rc != 0

      - name: Changing Default Shell to ZSH
        become: yes
        user: 
          name: '{{ ansible_user_id }}'
          shell: /bin/zsh 

      - name: Changing Default ZSH Theme
        lineinfile:
          path: /home/{{ ansible_user_id }}/.zshrc
          regexp: '^ZSH_THEME='
          line: 'ZSH_THEME="cloud"'

      - name: Creating ZSH Completion folder
        file:
          path: /home/{{ ansible_user_id }}/.oh-my-zsh/completions
          state: directory
          mode: 0755

      - name: Adding autoload to compinit
        lineinfile:
          path: /home/{{ ansible_user_id }}/.zshrc
          line: 'autoload -U compinit && compinit'
          state: present
      
    - block:
      - name: Download Google Key
        become: true
        get_url:
          url: 'https://dl.google.com/linux/linux_signing_key.pub'
          dest: /tmp/google-chrome.pub

      - name: Install Google Key
        become: true
        shell:
          cmd: gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome.pub
          creates: /usr/share/keyrings/google-chrome.gpg

      - name: Install Google Repository
        become: true
        apt_repository:
          repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main'
          state: present
          filename: google-chrome

      - name: Install Google Chrome
        become: true
        apt:
          name: google-chrome-stable

    - block:
      - name: Installing Vagrant...
        become: true
        unarchive:
          src: 'https://releases.hashicorp.com/vagrant/2.4.9/vagrant_2.4.9_linux_amd64.zip'
          dest: /usr/local/bin
          remote_src: yes

    - block:
      - name: Installing Terraform 1.16.X
        become: true
        unarchive:
          src: 'https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip'
          dest: /usr/local/bin
          remote_src: yes       
             
    - block:
      - name: Download Microsoft Key
        become: true
        get_url:
          url: 'https://packages.microsoft.com/keys/microsoft.asc'
          dest: /tmp/microsoft.asc

      - name: Install Microsoft Key
        become: true
        shell:
          cmd: gpg --dearmor -o /usr/share/keyrings/microsoft.gpg /tmp/microsoft.asc
          creates: /usr/share/keyrings/microsoft.gpg

      - name: Install VSCode Repository
        become: true
        apt_repository:
          repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/vscode stable main'
          state: present
          filename: vscode

      - name: Install Visual Studio Code
        become: true
        apt:
          name: code

      - name: Install Virtual Studio Code Extensions
        shell:
          cmd: code --install-extension '{{ item }}' 
        loop: 
          - ms-python.python
          - ms-azuretools.vscode-docker
          - bbenoist.vagrant
          - hashicorp.terraform
          - gruntfuggly.todo-tree
          - njpwerner.autodocstring
          - eamodio.gitlens
          - amazonwebservices.aws-toolkit-vscode    
          - dracula-theme.theme-dracula   
          - ms-ceintl.vscode-language-pack-pt-br
          - vscode-icons-team.vscode-icons

    - block: 
      - name: Download Docker Key
        become: true
        get_url:
          url: 'https://download.docker.com/linux/ubuntu/gpg'
          dest: /tmp/docker.gpg

      - name: Install Docker Key
        become: true
        shell:
          cmd: gpg --dearmor -o /usr/share/keyrings/docker-ce.gpg /tmp/docker.gpg
          creates: /usr/share/keyrings/docker-ce.gpg

      - name: Install Docker Repository
        become: true
        apt_repository:
          repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/docker-ce.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
          state: present
          filename: docker-ce
          
      - name: Install Docker
        become: true
        apt:
          name: docker-ce

      - name: Adding existing user to group Docker
        become: yes
        user: 
          name: '{{ ansible_user_id }}'
          groups: docker 
          append: yes

      - name: Install Docker-Compose
        become: true
        get_url:
          url: 'https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64'
          dest: '/usr/local/bin/docker-compose'
          mode: 755

      - name: Install Docker Machine Bash Completion
        become: true
        get_url:
          url: 'https://raw.githubusercontent.com/docker/machine/v0.16.2/contrib/completion/bash/docker-machine.bash'
          dest: '/etc/bash_completion.d/docker-machine'

      - name: Install Docker-Compose Bash Completion
        become: true
        get_url:
          url: 'https://raw.githubusercontent.com/docker/compose/1.26.2/contrib/completion/bash/docker-compose'
          dest: '/etc/bash_completion.d/docker-compose'

      - name: Adding plugins in ZSHRC...
        lineinfile:
          path: /home/{{ ansible_user_id }}/.zshrc
          regexp: '^plugins='
          line: 'plugins=(git docker docker-compose terraform sudo kubectl kube-ps1 zsh-autosuggestions zsh-syntax-highlighting zsh-history-substring-search kubectl-autocomplete)'
        
    - block:
      - name: Installing Kubectl 1.37
        become: true
        get_url:    
          url: 'https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl'
          dest: /usr/local/bin/kubectl
          mode: 755

      - name: Downloading Kubectx and Kubens 
        become: true
        git:
          repo: 'https://github.com/ahmetb/kubectx'
          dest: /opt/kubectx 

      - name: Creating Symlink to kubectx and kubens 
        become: true
        file:
          src: '/opt/kubectx/{{ item }}'
          dest: '/usr/local/bin/{{ item }}'
          state: link
        with_items:
          - kubectx
          - kubens
  
      - name: Install Drawio...
        become: true
        apt:  
          deb: https://github.com/jgraph/drawio-desktop/releases/download/v31.4.5/drawio-amd64-31.4.5.deb  

      - name: Install flameshot 0.8.0...
        become: true
        apt:
          deb: https://github.com/flameshot-org/flameshot/releases/download/v0.8.0/flameshot_ubuntu_0.8.0-1_amd64.deb    

      - name: Install Discord
        become: true
        apt:
          deb: https://discord.com/api/download?platform=linux&format=deb

      - name: Install Epson L355 drivers....
        become: true
        apt:
          deb: https://download.ebz.epson.net/dsc/du/02/DriverDownloadInfo.do?LG2=JA&CN2=US&CTI=177&PRN=Linux%20deb%2064bit%20package&OSC=LX&DL    

      - name: Install Slack Desktop
        become: true        
        community.general.snap:
          name: 'slack'
          classic: yes
          
      - name: Install eksctl        
        shell: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Install Fuzzy Finder (fzf)     
        shell: |
          git clone --depth 1 https://github.com/junegunn/fzf.git ~/.fzf
          ~/.fzf/install
          
      - name: Install awscli-v2       
        shell: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          sudo unzip awscliv2.zip
          sudo ./aws/install   
          aws --version

      - name: Executar comando curl e salvar o script helm
        command: curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3        

      - name: Executar comando chmod
        command: chmod 700 get_helm.sh        
        args:
          chdir: .

      - name: Executar script get_helm.sh
        command: ./get_helm.sh
        args:
          chdir: .  

      - name: Download Kind binary
        become: true
        get_url:
          url: "https://github.com/kubernetes-sigs/kind/releases/latest/download/kind-linux-amd64"
          dest: "/usr/local/bin/kind"
          mode: 755                     
